
name: Importar B1ack main.js corrigido

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          ref: b1ackha7-integracao

      - name: Baixar arquivo original
        run: |
          curl -fL \
            https://raw.githubusercontent.com/djwalks/B1ackha7TV/main/app/main.js \
            -o launcher/js/b1ack-main.js

      - name: Corrigir erros do código
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("launcher/js/b1ack-main.js")
          code = path.read_text()

          old_clean = """  function cleanName(value) {
              return value.replace("""
          new_clean = """  function cleanName(value) {
              // eslint-disable-next-line no-control-regex
              return value.replace("""
          
          old_regex = r"""    return /^(?:assets\/)[a-zA-Z0-9_\-\/ .]+\.(?:png|jpe?g|webp)$/i.test(path) && path.indexOf('..') === -1;"""
          new_regex = r"""    return /^(?:assets\/)[a-zA-Z0-9_\/ .-]+\.(?:png|jpe?g|webp)$/i.test(path) && path.indexOf('..') === -1;"""

          if old_clean not in code:
              raise SystemExit("Não encontrei a função cleanName esperada.")

          if old_regex not in code:
              raise SystemExit("Não encontrei a expressão safeImagePath esperada.")

          code = code.replace(old_clean, new_clean, 1)
          code = code.replace(old_regex, new_regex, 1)

          path.write_text(code)
          print("Duas correções aplicadas.")
          PY

      - name: Verificar JavaScript
        run: node --check launcher/js/b1ack-main.js

      - name: Salvar no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/js/b1ack-main.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Corrige lint do B1ack main.js"
            git push
          fi
